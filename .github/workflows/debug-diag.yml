name: Debug build (diag)

on:
  push:
    branches: ["feature/native-dj-buildfix"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --console=plain > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            MSG=$(grep -E '^e: |error:|What went wrong|Execution failed' -A3 "$RUNNER_TEMP/build.log" | head -c 3500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle errors::$MSG"
            tail -n 40 "$RUNNER_TEMP/build.log"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: orpheon-debug-${{ github.sha }}
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14
